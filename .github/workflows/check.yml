name: Check toml++ Updates

on:
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

# Run one check at a time, so that two runs cannot both find no issue
# and create duplicates. A later run waits for the current one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for toml++ Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/update-tomlplusplus.sh --check --github-output "$GITHUB_OUTPUT"

      - name: Create issue if update available
        if: steps.check.outputs.update_available == 'true'
        env:
          CURRENT_VERSION: ${{ steps.check.outputs.current }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail the step when `gh` fails in a pipeline.
          set -o pipefail

          # Create the label when the repository does not have it, such as in a fork.
          # Do not use `--force`, which would change an existing label's color and description.
          # `gh label create` fails when the label exists, so check for it after a failure.
          # Label names are case-insensitive on GitHub.
          if ! CREATE_ERROR=$(gh label create dependencies --color 0366d6 --description "Updates to dependencies" 2>&1); then
            FOUND=$(gh label list --search dependencies --limit 100 --json name \
              --jq '[.[] | select(.name | ascii_downcase == "dependencies")] | length')
            if [ "$FOUND" = "0" ]; then
              echo "$CREATE_ERROR" >&2
              echo "::error::Could not create or find the dependencies label"
              exit 1
            fi
          fi

          # Check if an issue already exists for this version.
          # Count only issues with the title that this step creates,
          # so that other issues that name the version do not match.
          # Include closed issues, so that closing an issue without the update
          # does not make the next run open another one.
          EXISTING=$(gh issue list --label dependencies --state all --limit 1000 --json title |
            jq --arg latest "$LATEST_VERSION" \
              '[.[] | select((.title | startswith("Update toml++ from ")) and (.title | endswith(" to " + $latest)))] | length')

          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "Update toml++ from $CURRENT_VERSION to $LATEST_VERSION" \
              --label "dependencies" \
              --body "A new version of [toml++](https://github.com/marzer/tomlplusplus) is available.

          **Current version:** $CURRENT_VERSION
          **Latest version:** $LATEST_VERSION

          ## Update Instructions

          \`\`\`bash
          ./Scripts/update-tomlplusplus.sh
          swift test
          cd Tests/Integration && make test
          \`\`\`

          See [toml++ releases](https://github.com/marzer/tomlplusplus/releases) for changelog."
          fi

      - name: Summary
        env:
          CURRENT_VERSION: ${{ steps.check.outputs.current }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
          UPDATE_AVAILABLE: ${{ steps.check.outputs.update_available }}
        run: |
          {
            echo "## toml++ Version Check"
            echo ""
            echo "**Current version:** $CURRENT_VERSION"
            echo "**Latest version:** $LATEST_VERSION"
            if [ "$UPDATE_AVAILABLE" == "true" ]; then
              echo ""
              echo ":warning: **Update available!**"
            else
              echo ""
              echo ":white_check_mark: **Up to date**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
